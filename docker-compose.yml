services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campusfind
      POSTGRES_PASSWORD: campusfind
      POSTGRES_DB: campusfind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusfind"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://campusfind:campusfind@db:5432/campusfind
      DIRECT_URL: postgresql://campusfind:campusfind@db:5432/campusfind
      ENABLE_APP_CRON: "true"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:4000/api"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID}"
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  pgdata: {}
